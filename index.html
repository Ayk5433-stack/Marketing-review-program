<style>
/* Layout: sticky top bar + tabs; single content column (max 1360px) of cards; item profile = header strip + asset cards grid. */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --sunk:#e9edf4; --ink:#141a26; --muted:#5d6779; --line:#dde2eb;
  --accent:#2c4bd6; --accent-ink:#ffffff; --accent-soft:#e6ebfc;
  --ok:#11795a; --ok-bg:#ddf3ea; --warn:#946200; --warn-bg:#fdf1d2; --bad:#c42b2b; --bad-bg:#fbe4e4;
  --exp:#a3245e; --exp-bg:#f8e1ec; --due:#6a45c4; --due-bg:#efe9fd; --new:#1e6aa8; --new-bg:#e1eef9; --miss:#8a93a3; --miss-bg:#edf0f4;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05); --bar-ink:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --panel:#171c27; --sunk:#1f2533; --ink:#e6eaf2; --muted:#98a2b5; --line:#2a3141;
  --accent:#7d95ff; --accent-ink:#0f131b; --accent-soft:#232c4d;
  --ok:#4cc79a; --ok-bg:#15352b; --warn:#e8b54d; --warn-bg:#3a3018; --bad:#ff7676; --bad-bg:#3f1d20;
  --exp:#ff79b0; --exp-bg:#3d1b2c; --due:#b59cff; --due-bg:#2a2445; --new:#6db5ff; --new-bg:#162c45; --miss:#8a93a3; --miss-bg:#252b37;
  --shadow:0 1px 2px rgba(0,0,0,.3); --bar-ink:#0f131b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f131b; --panel:#171c27; --sunk:#1f2533; --ink:#e6eaf2; --muted:#98a2b5; --line:#2a3141;
  --accent:#7d95ff; --accent-ink:#0f131b; --accent-soft:#232c4d;
  --ok:#4cc79a; --ok-bg:#15352b; --warn:#e8b54d; --warn-bg:#3a3018; --bad:#ff7676; --bad-bg:#3f1d20;
  --exp:#ff79b0; --exp-bg:#3d1b2c; --due:#b59cff; --due-bg:#2a2445; --new:#6db5ff; --new-bg:#162c45; --miss:#8a93a3; --miss-bg:#252b37;
  --shadow:0 1px 2px rgba(0,0,0,.3); --bar-ink:#0f131b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;line-height:1.3}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
textarea{width:100%;resize:vertical}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;gap:14px;align-items:center;padding:10px 16px;max-width:1360px;margin:0 auto}
.brand{font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
#q{flex:1;min-width:0}
.themebtn{flex:none;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink)}
.themebtn svg{width:19px;height:19px}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none;max-width:1360px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 11px;white-space:nowrap;color:var(--muted);font-weight:500}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;margin-left:5px;font-weight:600}
#demo-bar{background:var(--accent-soft);color:var(--ink);text-align:center;font-size:12.5px;padding:6px 16px}
main{padding-block:16px 40px;padding-inline:16px;max-width:1360px;margin:0 auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
h2.sec{font:700 15px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px}
.err{color:var(--bad)}

/* chips & dots */
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ok{color:var(--ok);background:var(--ok-bg)}.s-warn{color:var(--warn);background:var(--warn-bg)}.s-bad{color:var(--bad);background:var(--bad-bg)}
.s-exp{color:var(--exp);background:var(--exp-bg)}.s-due{color:var(--due);background:var(--due-bg)}.s-new{color:var(--new);background:var(--new-bg)}.s-miss{color:var(--miss);background:var(--miss-bg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-exp{background:var(--exp)}.d-due{background:var(--due)}.d-new{background:var(--new)}.d-miss{background:transparent;box-shadow:inset 0 0 0 2px var(--miss)}

/* dashboard */
.dash-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:14px}
.ready-num{font:700 64px/0.95 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ready-num small{font-size:26px;color:var(--muted);font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:12px}
.rules dt{color:var(--muted)}.rules dd{margin:0;font-weight:500}
.health{display:flex;flex-direction:column;gap:16px}
.hrow2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.hlabel{font-weight:600}
.hlabel small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.sbar{display:flex;gap:2px;height:30px;border-radius:7px;overflow:hidden}
.sbar button{border:none;border-radius:0;padding:0;min-width:3px;font:600 12px/30px var(--f-body);color:var(--bar-ink);overflow:hidden;white-space:nowrap;text-overflow:clip;font-variant-numeric:tabular-nums}
.sbar button:hover{filter:brightness(1.12)}
.b-ok{background:var(--ok)}.b-due{background:var(--due)}.b-new{background:var(--new)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-exp{background:var(--exp)}
.b-miss{background:repeating-linear-gradient(135deg,var(--miss-bg) 0 6px,var(--sunk) 6px 12px)!important;color:var(--muted)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.alert{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
.alert b{font:700 30px/1 var(--f-display);color:var(--bad);font-variant-numeric:tabular-nums}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lst{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:10px;background:var(--panel)}
.lst b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.lst.zero b{color:var(--ok)}

/* items list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 11px}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:10px}
.grid.m{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.grid.l{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.tile:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/10;max-width:100%;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tbody{padding:7px 10px 9px;min-width:0}
.tno{font:500 13px var(--f-mono)}
.tname{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdots{display:flex;gap:8px;margin-top:6px;align-items:center;font-size:11px;color:var(--muted)}
.tdots span{display:inline-flex;gap:3px;align-items:center}
.grid.s .tname{display:none}.grid.s .tbody{padding:4px 6px}.grid.s .tno{font-size:11px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
td .mini{width:64px;height:40px;object-fit:cover;border-radius:4px;display:block;background:var(--sunk)}
.more{text-align:center;margin:14px}

/* item profile */
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);font-weight:500}
.phead{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:18px;align-items:start}
.phead .pthumb{aspect-ratio:16/10;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.phead .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pno{font:500 13px var(--f-mono);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pname{font:700 34px/1.05 var(--f-display);margin:4px 0 10px;text-wrap:balance}
.psum{display:flex;flex-wrap:wrap;gap:8px}
.psum button{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border-radius:999px;font-size:13px}
.pfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-top:14px;font-size:13px}
.pfacts div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
.bigbtn{padding:9px 15px;font-size:14px}
.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.asset{display:flex;flex-direction:column;gap:9px;min-width:0}
.asset h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.prev{aspect-ratio:16/9;max-width:100%;background:var(--sunk);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);font-size:13px;text-align:center}
.prev img,.prev iframe,.prev video{width:100%;height:100%;object-fit:contain;border:0;display:block}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,22,.18);border:none;border-radius:0;color:#fff;font-size:40px}
.loadvid{border:none;background:none;color:var(--muted);font-size:14px;font-weight:600}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtns button{padding:8px 4px;font-weight:600;font-size:13px}
.sbtns .on-ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.sbtns .on-warn{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.sbtns .on-bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:600}
.linkrow{display:flex;gap:6px;align-items:center}.linkrow input{flex:1;min-width:0}
.linkview{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkchip{font-size:12.5px;background:var(--sunk);border-radius:6px;padding:4px 8px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.updated{font-size:12.5px;border-radius:8px;padding:6px 10px;background:var(--sunk);overflow-wrap:anywhere}
.updated.fresh{background:var(--new-bg)}.updated.fresh b{color:var(--new)}
.qseg button{padding:4px 12px;font-size:12.5px;font-weight:600}
.thumb{position:relative}
.newlink{position:absolute;top:6px;left:6px;background:var(--new);color:var(--panel);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.extra{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;font-size:13px;margin:0}
.extra dt{color:var(--muted)}.extra dd{margin:0;overflow-wrap:anywhere}
.hist td{white-space:normal;vertical-align:top}
.hist td.w{max-width:340px;overflow-wrap:anywhere}
.kbd{font-size:12px;color:var(--muted);margin:0}

/* new videos, import, settings */
.vrow{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.vrow img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;max-width:100%}
.vact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.vact input{width:120px}
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px 16px;align-items:center}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* login, toast, modal */
.login{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.login .brand{font-size:28px}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:13px}
.rolechip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.nudge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:12px 16px}
.ro-note{white-space:pre-wrap;font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.users td select{padding:4px 8px}
.roles{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:12px}
.roles dt{font-weight:600}.roles dd{margin:0;color:var(--muted)}
#busy{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:55;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
#busy i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.waiting{cursor:progress}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;pointer-events:auto}
#toast a{color:inherit}
#modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal .card{max-width:440px;width:100%}
#loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:860px){
  .dash-top{grid-template-columns:1fr}
  .phead{grid-template-columns:1fr}
  .phead .pthumb{max-width:420px}
  .phead .navbtns{order:-1}
}
@media (max-width:640px){
  .hrow{padding:8px 16px;gap:10px}.brand{font-size:17px}
  .hrow2{grid-template-columns:1fr;gap:6px}
  .form{grid-template-columns:1fr;gap:6px}
  .form > label{margin-top:8px}
  .vrow{grid-template-columns:96px minmax(0,1fr)}.vrow img{width:96px}.vact{grid-column:1/-1;justify-content:flex-start}
  .navbtns{width:100%}.navbtns button{flex:1}
  .pname{font-size:28px}
  .ready-num{font-size:52px}
}
</style>
</head>
<body>
<div id="demo-bar" hidden></div>
<header id="hdr" hidden>
  <div class="hrow">
    <div class="brand">Marketing <span>Portfolio</span></div>
    <input id="q" type="search" placeholder="Search item #, name or video title" aria-label="Search items">
    <button id="themebtn" class="themebtn" data-act="theme" type="button"></button>
  </div>
  <nav id="nav">
    <button data-go="dash">Dashboard</button>
    <button data-go="items">Items</button>
    <button data-go="review">Review</button>
    <button data-go="videos">New videos<span id="vbadge"></span></button>
    <button data-go="import" id="nav-import">Import links</button>
    <button data-go="users" id="nav-users" hidden>Users</button>
    <button data-go="settings">Settings</button>
  </nav>
</header>
<main id="main"><div id="loading">Loading portfolio…</div></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy" hidden role="status" aria-live="polite"><i></i><span>Working…</span></div>

<script>
/* =============================== state =============================== */
const S = {
  items: [], byNo: {}, videos: [], settings: {}, user: '', lastJob: '',
  view: 'dash', filter: 'all', search: '', priceOnly: true, cat: '', categories: [], layout: 'grid', size: 'm',
  queue: [], qi: 0, queueLabel: '', shown: 300, preview: [], vsel: {}
};
const DEMO = typeof window.DEMO_API === 'function';
const ASSETS = [
  { k: 'photo', label: 'Photo', short: 'P' },
  { k: 'video', label: 'Physical video', short: 'V' },
  { k: 'ub', label: 'Unbranded video', short: 'U' },

async function rpc(fn, body) {
  const c = CONF();
  const headers = { 'Content-Type': 'application/json', apikey: c.key };
  if (/^eyJ/.test(c.key)) headers.Authorization = 'Bearer ' + c.key;   // older "anon" keys
  let r;
  try { r = await fetch(c.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: headers, body: JSON.stringify(body || {}) }); }
  catch (e) { throw new Error('Could not reach the database. Check your internet connection and SUPABASE_URL at the top of this file.'); }
  let j = null;
  try { j = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) {
    const msg = String((j && (j.message || j.msg || j.error_description || j.error)) || ('Database error ' + r.status));
    if (r.status === 404 || /Could not find the function/i.test(msg)) throw new Error('The database is missing the portfolio functions. Run supabase-setup.sql in Supabase → SQL Editor.');
    if (r.status === 401 || /api key/i.test(msg)) throw new Error('The Supabase key is not right. Check SUPABASE_KEY at the top of this file.');
    const err = new Error(msg.replace(/^AUTH:\s*/, '')); err.auth = /^AUTH:/.test(msg); throw err;
  }
  return j;
}

/* =============================== YouTube (runs in the browser with the key from Settings) =============================== */
async function ytApi(path, params) {
  const key = String(S.settings.youtube_api_key || '').trim();
  if (!key) throw new Error('Add the YouTube API key in Settings first (an administrator can do this).');
  let r;
  try { r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + new URLSearchParams(Object.assign({}, params, { key: key }))); }
  catch (e) { throw new Error('Could not reach YouTube. Check your internet connection.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) {
    const m = String((j.error && j.error.message) || ('YouTube error ' + r.status)).replace(/<[^>]+>/g, '');
    if (/referer|referrer|blocked/i.test(m)) throw new Error('YouTube refused requests from this web address. In Google Cloud Console → Credentials, add this site to the API key\'s allowed websites.');
    if (/quota/i.test(m)) throw new Error('The YouTube daily quota is used up. It resets at midnight Pacific time.');
    throw new Error('YouTube: ' + m);
  }
  return j;
}
function isoDur(s) {
  const m = String(s || '').match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/);
  if (!m) return '';
  const h = (+m[1] || 0) * 24 + (+m[2] || 0), mi = +m[3] || 0, se = +m[4] || 0;
  return (h ? h + ':' + String(mi).padStart(2, '0') : mi) + ':' + String(se).padStart(2, '0');
}
/** {videoId: {yt_title, yt_channel, yt_published, yt_definition, yt_duration, yt_views}} */
async function ytMeta(ids) {
  const out = {}, uniq = [...new Set(ids.filter(Boolean))];
  for (let i = 0; i < uniq.length; i += 50) {
    const j = await ytApi('videos', { part: 'snippet,contentDetails,statistics', id: uniq.slice(i, i + 50).join(','), maxResults: 50 });
    (j.items || []).forEach(v => {
      out[v.id] = {
        yt_title: v.snippet.title, yt_channel: v.snippet.channelTitle, yt_published: v.snippet.publishedAt,
        yt_definition: String(v.contentDetails.definition || '').toUpperCase(), yt_duration: isoDur(v.contentDetails.duration),
        yt_views: v.statistics && v.statistics.viewCount != null ? String(v.statistics.viewCount) : ''
      };
    });
  }
  return out;
}
const alnum = v => norm(v).replace(/[^A-Z0-9]/g, '');
/** Finds a tracker item number inside a video title. */
function itemMatcher() {
  const set = {};
  S.items.forEach(it => { const k = alnum(it.item_no); if (k.length >= 3 && /\d/.test(k)) set[k] = it.item_no; });
  return title => {
    const t = String(title || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
    let best = '';
    for (let n = 3; n >= 1; n--) for (let j = 0; j + n <= t.length; j++) { const k = t.slice(j, j + n).join(''); if (set[k] && k.length > best.length) best = k; }
    return best ? set[best] : '';
  };
}
function channelRef(h) {
  h = String(h || '').trim();
  let m = h.match(/youtube\.com\/channel\/(UC[A-Za-z0-9_-]{22})/i); if (m) return m[1];
  m = h.match(/youtube\.com\/(@[A-Za-z0-9._-]+)/i); if (m) return m[1];
  return h.replace(/\/+$/, '');
}

['video', 'ub', 'yt'].forEach(a => EDITABLE.add(a + '_quality'));
const YT_META_KEYS = ['yt_title', 'yt_channel', 'yt_published', 'yt_definition', 'yt_duration', 'yt_views'];
function resetAsset(a) {
  const o = {}; o[a + '_status'] = ''; o[a + '_reviewed_at'] = ''; o[a + '_reviewed_by'] = '';
  if (a !== 'photo') o[a + '_quality'] = '';
  if (a === 'yt') { YT_META_KEYS.forEach(k => { o[k] = ''; }); o.yt_id = ''; }
  return o;
}
/** Turns what the person changed into the full set of fields to store (a new link resets its review, etc.). */
function buildPatch(base, patch) {
  const out = {}, log = [], needYt = [], now = new Date().toISOString(), user = S.user, no = base.item_no;
  Object.keys(patch).forEach(k => {
    if (!EDITABLE.has(k)) return;
    const v = patch[k] == null ? '' : String(patch[k]).trim();
    const old = base[k] == null ? '' : String(base[k]);
    const m = k.match(/^(photo|video|ub|yt)_(url|status)$/);
    if (m && m[2] === 'url') {
      if (v === old) return;
      if (m[1] === 'yt' && v && ytId(v) && ytId(v) === base.yt_id) { out[k] = v; return; }
      Object.assign(out, resetAsset(m[1]));
      out[m[1] + '_prev_url'] = old;
      out[m[1] + '_link_updated_at'] = now; out[m[1] + '_link_updated_by'] = user;
      if (m[1] === 'yt') { const id = ytId(v); out.yt_id = id; if (id) needYt.push(id); }
      out[k] = v;
      log.push({ item_no: no, field: k, old: old, new: v });
      return;
    }
    if (m && m[2] === 'status') {
      if (['', 'Acceptable', 'Needs update', 'Unacceptable'].indexOf(v) < 0) throw new Error('Unknown status: ' + v);
      out[k] = v; out[m[1] + '_reviewed_at'] = v ? now : ''; out[m[1] + '_reviewed_by'] = v ? user : '';
      log.push({ item_no: no, field: k, old: old, new: v || '(cleared)' });
      return;
    }
    if (/_quality$/.test(k) && ['', '720p', '1080p', '4K'].indexOf(v) < 0) throw new Error('Quality must be 720p, 1080p or 4K.');
    out[k] = v;
    if (v !== old) log.push({ item_no: no, field: k, old: old, new: v });
  });
  return { patch: out, log: log, needYt: needYt };
}
async function addYtMeta(rows) {   // rows: [{patch}] — fills YouTube title/date for new links when the key is set
  const ids = rows.map(r => r.patch.yt_id).filter(Boolean);
  if (!ids.length || !S.settings.youtube_api_key) return;
  try {
    const meta = await ytMeta(ids);
    rows.forEach(r => { const m = r.patch.yt_id && meta[r.patch.yt_id]; if (m) Object.assign(r.patch, m); else if (r.patch.yt_id) r.patch.yt_title = '⚠ Not found (private, deleted or bad link)'; });
  } catch (e) { console.warn('YouTube details will fill in on the next refresh:', e.message); }
}

    out.push(...part);
  }
  return out;
}

SHEET_COLS.forEach(c => { SHEET_KEY[c[0]] = c[0]; SHEET_KEY[c[1].toLowerCase()] = c[0]; });
const OLD_4K = { 'physical video 4k': 'video_quality', 'video_4k': 'video_quality', 'unbranded video 4k': 'ub_quality', 'ub_4k': 'ub_quality', 'youtube 4k': 'yt_quality', 'yt_4k': 'yt_quality' };
const isDate = v => Object.prototype.toString.call(v) === '[object Date]';
const cellText = v => {
  if (v == null) return '';
  if (isDate(v)) {
    if (isNaN(v)) return '';
    const midnight = !v.getHours() && !v.getMinutes() && !v.getSeconds();
    return midnight ? v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0') : v.toISOString();
  }

};
/** Reads an Excel/CSV download of the Google Sheet: the Items tab (by its headers) and the Categories tab. */
function parseWorkbook(wb, fileName) {
  let itemsSheet = null, hdrRow = 0, hdr = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      const keys = rows[i].map(h => SHEET_KEY[String(h).trim().toLowerCase()]);
      if (keys.indexOf('item_no') >= 0 && (keys.indexOf('photo_url') >= 0 || keys.indexOf('yt_url') >= 0 || keys.indexOf('name') >= 0)) { itemsSheet = rows; hdrRow = i; hdr = rows[i].map(String); break; }
    }
    if (itemsSheet) break;
  }
  if (!itemsSheet) throw new Error('Could not find a tab with an "Item #" column. Use File → Download → Microsoft Excel on your Google Sheet.');
  const map = hdr.map(h => {
    const t = h.trim(), l = t.toLowerCase();
    if (!t) return null;
    if (SHEET_KEY[l]) return { key: SHEET_KEY[l] };
    if (OLD_4K[l]) return { key: OLD_4K[l], fourK: true };
    if (/\(auto\)\s*$/i.test(t)) return null;           // the program fills these in itself
    if (/^(last social post|social platform|social note)$/i.test(t)) return null;   // social tracking was removed
    return { extra: t };
  });
  const items = [], seen = {}, extraCols = new Set();
  itemsSheet.slice(hdrRow + 1).forEach(r => {
    const patch = {}, extra = {};
    map.forEach((m, i) => {
      if (!m) return;
      const v = cellText(r[i]); if (!v) return;
      if (m.extra) { extra[m.extra] = v; extraCols.add(m.extra); return; }
      if (m.fourK) { if (/^(yes|true|4k)$/i.test(v) && !patch[m.key]) patch[m.key] = '4K'; return; }
      patch[m.key] = v;
    });
    const no = String(patch.item_no || '').trim(); delete patch.item_no;
    if (!no || seen[norm(no)]) return;
    seen[norm(no)] = 1;
    if (patch.yt_url && ytId(patch.yt_url)) patch.yt_id = ytId(patch.yt_url);
    ['video', 'ub', 'yt'].forEach(a => { if (patch[a + '_quality'] && ['720p', '1080p', '4K'].indexOf(patch[a + '_quality']) < 0) delete patch[a + '_quality']; });
    if (Object.keys(extra).length) patch.extra = extra;
    items.push({ item_no: no, patch: patch });
  });
  let categories = [];
  const catName = wb.SheetNames.find(n => /^categor/i.test(n));
  if (catName) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[catName], { header: 1, raw: false, defval: '' });
    categories = rows.slice(1).map(r => String(r[0] || '').trim()).filter(Boolean);
  }
  const known = hdr.map((h, i) => map[i] && map[i].key ? h : null).filter(Boolean);
  return { fileName: fileName, items: items, categories: categories, known: known, extraCols: [...extraCols] };
}

/* Shows "Working…" while a request is in flight. */
let pending = 0, busyT;
const BUSY_LABEL = { saveItem: 'Saving…', getData: 'Loading…', importLinks: 'Importing…', importItems: 'Importing…', linkVideos: 'Linking videos…',
  scanChannels: 'Scanning YouTube channels…', refreshYouTube: 'Refreshing YouTube details…', importWorkbook: 'Loading your spreadsheet…',
  saveUser: 'Saving account…', listUsers: 'Loading accounts…', listLogins: 'Loading sign-in log…', login: 'Signing in…', changePassword: 'Saving password…', saveSettings: 'Saving settings…', getItemLog: 'Loading history…' };
function busy(on, fn) {
  pending = Math.max(0, pending + (on ? 1 : -1));
  const b = document.getElementById('busy');
  clearTimeout(busyT);
  if (pending) {
    b.querySelector('span').textContent = BUSY_LABEL[fn] || 'Working…';
    busyT = setTimeout(() => { if (pending) { b.hidden = false; document.body.classList.add('waiting'); } }, 250);
  } else { b.hidden = true; document.body.classList.remove('waiting'); }
}
async function call(fn, ...args) {
  busy(true, fn);
  try { return await callNow(fn, args); } finally { busy(false); }
}
async function callNow(fn, args) {
  if (DEMO) return window.DEMO_API(fn, args, 'Albert');
  const f = BE[fn];
  if (!f) throw new Error('Unknown action: ' + fn);
  return f.apply(null, args);
}
let toastT;
function toast(msg, ms) {

/** In-page confirmation (works everywhere, unlike window.confirm). Resolves true/false,

function ask(title, body, okLabel, inputLabel) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = '<div class="card stack" role="dialog" aria-modal="true"><h2 class="sec" style="margin:0">' + esc(title) + '</h2><div>' + body + '</div>' +
      (inputLabel ? '<label class="small" style="display:flex;flex-direction:column;gap:4px;font-weight:500">' + esc(inputLabel) + '<input id="m_in" type="text" autocomplete="off"></label>' : '') +
      '<div class="row" style="justify-content:flex-end"><button id="m_no">Cancel</button><button id="m_yes" class="pri">' + esc(okLabel || 'Continue') + '</button></div></div>';
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; res(v); };
    $('#m_no').onclick = () => done(inputLabel ? null : false);

function ytId(u) {
  u = String(u || '').trim();
  const m = u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/|\/v\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(u) ? u : '';
}
function driveId(u) {
  u = String(u || '');
  if (!/(drive|docs)\.google\.com/.test(u)) return '';
  const m = u.match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  return m ? m[1] : '';
}
const IMG_RE = /\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i, VID_RE = /\.(mp4|mov|m4v|webm)(\?|#|$)/i;

/* =============================== status logic =============================== */
function eff(it, a) {
  if (!it[a + '_url']) return 'Missing';
  if (a === 'yt' && it.yt_published && new Date(it.yt_published) < CUT) return 'Expired';
  const st = it[a + '_status'];
  if (!st) return 'Unreviewed';
  if (st === 'Acceptable') {
    const r = it[a + '_reviewed_at'];
    if (!r || addMonths(r, S.settings.review_months || 6) < new Date()) return 'Review due';
  }
  return st;
}
const chip = st => '<span class="chip s-' + CLS[st] + '">' + esc(st) + '</span>';
const onSheet = it => !/^(no|false|n|0)$/i.test(String(it.on_price_sheet || '').trim());

const FILTERS = [
  ['all', 'All items', () => true],
  ['new_links', 'New links waiting for review', it => ASSETS.some(a => it[a.k + '_url'] && it[a.k + '_link_updated_at'] && !it[a.k + '_status'])],
  ['attention', 'Needs attention (anything not acceptable)', it => !isReady(it)],
  ['ready', 'Fully ready (all four acceptable)', isReady],
  ['unreviewed', 'Unreviewed / new links', it => ASSETS.some(a => eff(it, a.k) === 'Unreviewed')],
  ['review_due', 'Review due (older than review period)', it => ASSETS.some(a => eff(it, a.k) === 'Review due')],
  ['photo_bad', 'Photo: needs update / unacceptable', it => BAD.has(eff(it, 'photo'))],
  ['photo_missing', 'Photo: missing', it => !it.photo_url],
  ['video_bad', 'Physical video: needs update / unacceptable', it => BAD.has(eff(it, 'video'))],
  ['video_missing', 'Physical video: missing', it => !it.video_url],
  ['ub_bad', 'Unbranded video: needs update / unacceptable', it => BAD.has(eff(it, 'ub'))],
  ['ub_missing', 'Unbranded video: missing', it => !it.ub_url],
  ['yt_expired', 'YouTube: expired (before cutoff)', it => eff(it, 'yt') === 'Expired'],
  ['yt_bad', 'YouTube: needs update / unacceptable', it => BAD.has(eff(it, 'yt'))],
  ['yt_missing', 'YouTube: missing', it => !it.yt_url],
  ['missing_either', 'Missing physical video OR YouTube', it => !it.video_url || !it.yt_url],
  ['missing_both', 'Missing BOTH physical video and YouTube', it => !it.video_url && !it.yt_url],
  ['not4k', 'Below 4K (720p or 1080p)', it => ['video', 'ub', 'yt'].some(a => it[a + '_url'] && (it[a + '_quality'] === '720p' || it[a + '_quality'] === '1080p'))],
  ['q720', 'Has a 720p video', it => ['video', 'ub', 'yt'].some(a => it[a + '_url'] && it[a + '_quality'] === '720p')],
  ['unknown4k', 'Video quality not set yet', it => ['video', 'ub', 'yt'].some(a => it[a + '_url'] && !it[a + '_quality'])],

function recent(at, days) { if (!at) return false; const d = new Date(at); return !isNaN(d) && Date.now() - d < days * 864e5; }
const FMAP = Object.fromEntries(FILTERS.map(f => [f[0], f]));
function getFilter(id) {

function setHash(h, replace) {

function go(v, opts) {

    S.queue = filtered().map(it => it.item_no); S.qi = 0;
    S.queueLabel = getFilter(S.filter)[1] + (S.search ? ' · search "' + S.search + '"' : '');
    if (!S.queue.length) { toast('No items in this view to review.'); return; }
    return openItem(S.queue[0], false);

  if (v === 'items') S.shown = 300;
  setHash('#/' + v, opts.replace);

}
function openItem(no, replace) {
  const i = S.queue.findIndex(x => norm(x) === norm(no));
  if (i >= 0) S.qi = i;

function fromHash() {
  const m = (location.hash || '').match(/^#\/(\w+)(?:\/(.+))?$/);

}
function routeFromHash() {

    if (!S.queue.length || !S.queue.some(x => norm(x) === norm(r.no))) {
      S.queue = filtered().map(it => it.item_no);
      S.queueLabel = getFilter(S.filter)[1];

    const i = S.queue.findIndex(x => norm(x) === norm(r.no));

}

  const backup = Object.assign({}, it);
  Object.keys(patch).forEach(k => {
    it[k] = patch[k];
    const m = k.match(/^(photo|video|ub|yt)_status$/);
    if (m) { it[m[1] + '_reviewed_at'] = patch[k] ? new Date().toISOString() : ''; it[m[1] + '_reviewed_by'] = patch[k] ? S.user : ''; }
  });
  refreshCards(no);
  try {
    const fresh = await call('saveItem', it.item_no, patch, backup);
    replaceItem(fresh);
    refreshCards(no);
    if (!quiet) toast('Saved ' + esc(it.item_no));
  } catch (e) {
    Object.keys(it).forEach(k => delete it[k]); Object.assign(it, backup);
    refreshCards(no);
    toast('Not saved: ' + errMsg(e), 6000);
    if (e.auth) signOut(e.message);

}

let ALNUM_IDX = null, ALNUM_N = -1;
/** Finds the tracker item for a piece of text like "DM-0902", "DM0902" or "DM0902_2" (ignores dashes, spaces and case). */
function matchItemNo(c) {
  c = String(c || '').trim(); if (!c) return '';
  if (getItem(c)) return getItem(c).item_no;
  if (!ALNUM_IDX || ALNUM_N !== S.items.length) { ALNUM_IDX = {}; ALNUM_N = S.items.length; S.items.forEach(it => { const k = alnum(it.item_no); if (k && !ALNUM_IDX[k]) ALNUM_IDX[k] = it.item_no; }); }
  let t = c;
  for (let i = 0; i < 4 && t; i++) {
    const k = alnum(t);
    if (k.length >= 3 && ALNUM_IDX[k]) return ALNUM_IDX[k];
    const cut = t.search(/[\s_\-(][^\s_\-(]*$/);   // drop a trailing "-2", "_front", " (1)" and try again
    if (cut <= 0) break;
    t = t.slice(0, cut);
  }
  return '';
}
/** Item number from a file link: the file name between the last "/" and the ".", e.g. …/video/DM-0902.mp4 → DM-0902. */
function itemFromUrl(url) {
  let seg = '';
  try { seg = decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop() || ''); } catch (e) { return ''; }
  const first = seg.indexOf('.'), last = seg.lastIndexOf('.');
  if (last <= 0) return '';
  const cands = [seg.slice(0, last), seg.slice(0, first)].map(x => x.trim()).filter(Boolean);
  for (const c of cands) { const m = matchItemNo(c); if (m) return m; }
  return cands[0] || '';
}
function guessType(url, dtype) {
  if (dtype && dtype !== 'auto') return dtype;
  if (ytId(url) && /youtu/.test(url)) return 'yt';
  if (/unbrand/i.test(url) && VID_RE.test(url)) return 'ub';
  if (IMG_RE.test(url)) return 'photo';
  if (VID_RE.test(url)) return 'video';
  return '';
}
function parsePaste(text, dtype) {
  const out = [];

    const parts = l.split(/[\t,;]+|\s+/).map(p => p.trim()).filter(Boolean);
    const urls = parts.filter(p => /^https?:\/\//i.test(p)), others = parts.filter(p => !/^https?:\/\//i.test(p));
    if (!urls.length) { out.push({ item_no: others[0] || '', url: '', type: '' }); return; }

}

function readFileRows(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
        res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' }));
      } catch (e) { rej(e); }
    };
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(file);
  });
}
let FILE_M = null, FILE_L = null;
const ITEM_COL = /item|sku|part|code|model|no\.?$|number|#/i;

function colGuess(h, sample) {
  const s = String(h).toLowerCase();
  if (/you ?tube|\byt\b/.test(s)) return 'yt';
  if (/unbrand|no.?logo|white.?label|generic|clean/.test(s)) return 'ub';
  if (/photo|picture|image|img|pic/.test(s)) return 'photo';
  if (/video|clip|footage/.test(s)) return 'video';
  const urls = sample.filter(v => /^https?:\/\//i.test(v));
  if (urls.length && urls.filter(u => /youtu/.test(u)).length > urls.length / 2) return 'yt';
  if (urls.length && urls.filter(u => IMG_RE.test(u)).length > urls.length / 2) return 'photo';
  if (urls.length && urls.filter(u => VID_RE.test(u)).length > urls.length / 2) return 'video';
  return urls.length ? 'video' : '';
}

function exportSheets(list) {
  const rv = (it, a) => it[a + '_reviewed_at'] ? isoDay(it[a + '_reviewed_at']) + ' ' + String(it[a + '_reviewed_by'] || '').split('@')[0] : '';
  const main = [['Item #', 'Name', 'Product category', 'On price sheet',
    'Photo link', 'Photo status', 'Photo note', 'Photo reviewed',
    'Physical video link', 'Physical video status', 'Physical video note', 'Physical video quality', 'Physical video reviewed',
    'Unbranded video link', 'Unbranded video status', 'Unbranded video note', 'Unbranded video quality', 'Unbranded video reviewed',
    'YouTube link', 'YouTube status', 'YouTube note', 'YouTube title', 'YouTube channel', 'YouTube uploaded', 'YouTube quality', 'YouTube reviewed']];
  list.forEach(it => main.push([
    it.item_no, it.name, it.category, onSheet(it) ? 'Yes' : 'No',
    it.photo_url, eff(it, 'photo'), it.photo_note, rv(it, 'photo'),
    it.video_url, eff(it, 'video'), it.video_note, it.video_quality, rv(it, 'video'),
    it.ub_url, eff(it, 'ub'), it.ub_note, it.ub_quality, rv(it, 'ub'),
    it.yt_url, eff(it, 'yt'), it.yt_note, it.yt_title, it.yt_channel, isoDay(it.yt_published), it.yt_quality, rv(it, 'yt')
  ].map(v => v == null ? '' : String(v))));
  const per = (a, extra) => [['Item #', 'Name', 'Product category', 'Link', 'Status', 'Note', 'Reviewed'].concat(extra.map(e => e[0]))]
    .concat(list.map(it => [it.item_no, it.name, it.category, it[a + '_url'], eff(it, a), it[a + '_note'], rv(it, a)].concat(extra.map(e => e[1](it))).map(v => v == null ? '' : String(v))));
  return [
    { name: 'Portfolio', rows: main },
    { name: 'Photos', rows: per('photo', [['Link updated', it => isoDay(it.photo_link_updated_at)]]) },
    { name: 'Physical videos', rows: per('video', [['Quality', it => it.video_quality], ['Link updated', it => isoDay(it.video_link_updated_at)]]) },
    { name: 'Unbranded videos', rows: per('ub', [['Quality', it => it.ub_quality], ['Link updated', it => isoDay(it.ub_link_updated_at)]]) },
    { name: 'YouTube', rows: per('yt', [['Uploaded', it => isoDay(it.yt_published)], ['Channel', it => it.yt_channel], ['Quality', it => it.yt_quality], ['Title', it => it.yt_title], ['Link updated', it => isoDay(it.yt_link_updated_at)], ['Previous link', it => it.yt_prev_url]]) }
  ];
}
function toWorkbook(sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet(s.rows);
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    for (let r = 1; r <= range.e.r; r++) for (let c = 0; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (cell && typeof cell.v === 'string' && /^https?:\/\//.test(cell.v)) cell.l = { Target: cell.v };
    }
    ws['!cols'] = s.rows[0].map((h, i) => ({ wch: Math.min(60, Math.max(10, String(h).length + 2, ...s.rows.slice(1, 200).map(r => String(r[i] || '').length))) }));
    ws['!autofilter'] = { ref: ws['!ref'] };
    XLSX.utils.book_append_sheet(wb, ws, s.name);
  });
  return wb;
}
async function doExport(kind) {
  const list = kind.endsWith('all') ? S.items.slice() : filtered();
  const fname = 'Marketing-Portfolio-' + (kind.endsWith('all') ? 'all' : String(S.filter).replace(/[^\w-]+/g, '-') + (S.cat ? '-' + S.cat.replace(/[^\w-]+/g, '-') : '')) + '-' + isoDay(new Date());
  const sheets = exportSheets(list);
  try {
    if (kind.startsWith('xlsx')) { XLSX.writeFile(toWorkbook(sheets), fname + '.xlsx'); toast('Downloading ' + esc(fname) + '.xlsx'); }
    else if (kind.startsWith('csv')) { XLSX.writeFile(toWorkbook([sheets[0]]), fname + '.csv', { bookType: 'csv' }); toast('Downloading ' + esc(fname) + '.csv'); }
  } catch (e) { toast('Export failed: ' + errMsg(e), 7000); }
}

  S.usersList = null; S.role = ''; S.pwNudge = false;
  viewLogin(msg);
}
async function start() {
  if (DEMO) {
    const bar = $('#demo-bar'); bar.hidden = false;
    bar.textContent = 'Demo with sample data, signed in as Albert (Administrator). Item numbers, names and links are made up, and changes reset when you reload.';
  } else if (!isConnected()) {
    main.innerHTML = '<form class="card login" id="connectform"><div class="brand">Marketing <span>Portfolio</span></div>' +
      '<p style="margin:0">This page isn\'t connected to your Supabase database yet. Find both values in Supabase → Project Settings → API Keys / Data API.</p>' +
      '<label for="cn_url">Project URL<input id="cn_url" type="url" required placeholder="https://abcdefghijkl.supabase.co"></label>' +
      '<label for="cn_key">Publishable (or anon public) key<input id="cn_key" type="text" required placeholder="sb_publishable_… or eyJ…" autocomplete="off"></label>' +
      '<button class="pri" type="submit">Connect</button>' +
      '<p class="muted small" style="margin:0">This connects only this browser, for testing. For the live page, paste the same two values into <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> near the top of index.html.</p></form>';
    return;
  } else if (!AUTH.token) { viewLogin(); return; }
  main.innerHTML = '<div id="loading">Loading portfolio…</div>';
  try {
    setData(await call('getData'));
    $('#hdr').hidden = false;
    routeFromHash();
    setTimeout(autoJobs, 1500);
  } catch (e) {
    if (e.auth) signOut(/sign-in has ended/.test(e.message) && !AUTH.token ? '' : e.message);
    else main.innerHTML = '<div class="card login"><h2 class="sec" style="margin:0">Could not load the portfolio</h2><p class="err" style="margin:0">' + errMsg(e) + '</p><button class="pri" data-act="retry">Try again</button></div>';
  }
}

/* Daily channel scan and daily YouTube refresh, run quietly when an editor opens the page. */
async function autoJobs() {
  if (DEMO || !canEdit() || !String(S.settings.youtube_api_key || '').trim()) return;
  const stale = (k, hours) => { const t = new Date(S.settings[k] || 0); return isNaN(t) || Date.now() - t > hours * 36e5; };
  try {
    if (stale('last_scan', 20)) {
      const r = await call('scanChannels');
      if (r.added) { await reload(); toast(r.added + ' new YouTube upload(s) found on your channels. See New videos.', 7000); }
    }
    if (stale('last_refresh', 20)) { await call('refreshYouTube'); if (S.view !== 'item') render(); }
  } catch (e) { console.warn('Automatic YouTube check skipped:', e.message); }
}

/* =============================== events =============================== */
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'loginform') {
    e.preventDefault();
    const btn = $('#lg_go'); btn.disabled = true; btn.textContent = 'Signing in…';
    const name = $('#lg_name').value.trim(), pw = $('#lg_pw').value, rem = $('#lg_rem').checked;
    try {
      const r = await call('login', name, pw, rem);
      AUTH.token = r.token; AUTH.name = r.user.username;
      store.set('mp_user', AUTH.name);
      if (rem) store.set('mp_token', AUTH.token); else store.del('mp_token');
      S.pwNudge = !!r.startingPassword;
      start();
    } catch (err) {
      viewLogin(err.message);
      $('#lg_name').value = name;
    }
  } else if (f.id === 'connectform') {
    e.preventDefault();
    const u = $('#cn_url').value.trim().replace(/\/(rest\/v1|auth\/v1)?\/*$/, ''), k = $('#cn_key').value.trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(u) && !/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(u)) { toast('That doesn\'t look like a Supabase project URL. It should look like https://abcdefghijkl.supabase.co', 8000); return; }
    if (k.length < 20) { toast('That key looks too short. Copy the whole publishable (or anon public) key.', 7000); return; }
    memConf = { url: u, key: k }; store.set('mp_sb_url', u); store.set('mp_sb_key', k);
    start();
  } else if (f.id === 'pwform') {
    e.preventDefault();
    const cur = $('#pw_cur').value, a = $('#pw_new').value, b = $('#pw_new2').value;
    if (a !== b) { toast('The two new passwords don\'t match.'); return; }
    try { await call('changePassword', cur, a); S.pwNudge = false; f.reset(); toast('Password changed'); }
    catch (err) { toast(errMsg(err), 6000); }
  } else if (f.id === 'adduser') {
    e.preventDefault();
    const name = $('#nu_name').value.trim(), role = $('#nu_role').value, pw = $('#nu_pw').value;
    await saveUser({ username: name, role: role, password: pw, isNew: true }, 'Added ' + esc(name) + ' as ' + esc(roleLabel(role)) + '. Send them their username and starting password.');
  }
});
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
  const act = el.dataset.act, no = el.dataset.no;
  switch (act) {
    case 'retry': start(); break;
    case 'applywb': {
      if (!S.wb) break;
      el.disabled = true; el.textContent = 'Loading…';
      try {
        const r = await call('importWorkbook', S.wb, $('#wboff') && $('#wboff').checked);
        S.wb = null; await reload();
        const msg = 'Loaded ' + nf(r.items) + ' items' + (r.categories ? ' and ' + r.categories + ' categories' : '') + (r.markedOff ? '. ' + r.markedOff + ' marked off the price sheet' : '') + '.';
        if (S.settings.youtube_api_key) {
          toast(msg + ' Filling in YouTube details…', 20000);
          try { const y = await call('refreshYouTube'); toast(msg + ' YouTube details filled in for ' + nf(y.changed) + ' item(s).', 9000); }
          catch (err) { toast(msg + ' YouTube details could not be filled in: ' + errMsg(err), 12000); }
          if (S.view !== 'item') render();
        } else toast(msg + ' Next: add the YouTube API key in Settings so titles and upload dates fill in.', 12000);
      } catch (err) { toast(errMsg(err), 8000); el.disabled = false; el.textContent = 'Try again'; }
      break;
    }
    case 'editlink': S.editLink = norm(no) + '|' + el.dataset.k; refreshCards(no); { const i = document.getElementById('url-' + el.dataset.k); if (i) { i.focus(); i.select(); } } break;
    case 'canceledit': S.editLink = ''; if (document.activeElement) document.activeElement.blur(); refreshCards(no); break;
    case 'quality': {
      const it = getItem(no), f = el.dataset.k + '_quality';
      save(no, { [f]: it[f] === el.dataset.v ? '' : el.dataset.v }, true); break;
    }
    case 'disconnect': memConf = {}; store.del('mp_sb_url'); store.del('mp_sb_key'); store.del('mp_token'); AUTH.token = ''; start(); break;
    case 'theme': setTheme(isDark() ? 'light' : 'dark'); break;
    case 'themeset': setTheme(el.dataset.v); break;
    case 'logout': signOut('', true); break;
    case 'upw': {
      const u = el.dataset.u;
      const pw = await ask('Reset password for ' + u, 'Type a new starting password and send it to ' + esc(u) + '. They will be signed out everywhere.', 'Reset password', 'New password (at least 6 characters)');
      if (pw != null) await saveUser({ username: u, password: pw }, 'Password reset for ' + esc(u));
      break;
    }
    case 'openfilter': S.filter = el.dataset.f; S.search = ''; $('#q').value = ''; go('items'); break;
    case 'priceonly': S.priceOnly = el.checked; render(); break;
    case 'layout': S.layout = el.dataset.v; render(); break;
    case 'size': S.size = el.dataset.v; render(); break;
    case 'more': S.shown = 1e9; render(); break;
    case 'open':
      S.queue = filtered().map(it => it.item_no);
      S.queueLabel = getFilter(S.filter)[1] + (S.search ? ' · search "' + S.search + '"' : '');
      openItem(no, false); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'jump': { const c = document.getElementById('card-' + el.dataset.k); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'history': showHistory(no); break;
    case 'status': save(no, { [el.dataset.k + '_status']: el.dataset.v }, true); break;
    case 'saveurl': {
      const k = el.dataset.k, v = document.getElementById('url-' + k).value.trim();
      const before = (getItem(no) || {})[k + '_url'] || '';
      el.disabled = true; el.textContent = 'Saving…';
      S.editLink = '';
      if (document.activeElement) document.activeElement.blur();
      await save(no, { [k + '_url']: v }, true);
      if (v !== before && (getItem(no) || {})[k + '_url'] === v) toast((k === 'yt' ? 'YouTube link' : 'Link') + ' updated for ' + esc(no));
      break;
    }
    case 'allgood': {
      const it = getItem(no), patch = {};
      ASSETS.forEach(a => { if (it[a.k + '_url']) patch[a.k + '_status'] = 'Acceptable'; });
      if (!Object.keys(patch).length) { toast('This item has no links yet.'); break; }
      save(no, patch, true); toast('Marked ' + esc(no) + ' acceptable'); step(1); break;
    }
    case 'toggleprice': save(no, { on_price_sheet: el.checked ? 'Yes' : 'No' }); break;
    case 'embed': {
      const it = getItem(no), box = el.closest('.prev');
      if (DEMO) { box.innerHTML = '<span style="padding:16px">The video plays right here on your live page.</span>'; break; }
      if (el.dataset.k === 'yt') box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(it.yt_id) + '?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="YouTube video"></iframe>';
      else {
        const d = driveId(it.video_url);
        box.innerHTML = d ? '<iframe src="https://drive.google.com/file/d/' + esc(d) + '/preview" allow="autoplay; fullscreen" allowfullscreen title="Video preview"></iframe>'
          : '<video controls autoplay src="' + esc(it.video_url) + '"></video>';
      }
      break;
    }
    case 'scan': case 'job': {
      const fn = act === 'scan' ? 'scanChannels' : el.dataset.fn;
      el.disabled = true; const txt = el.textContent; el.textContent = 'Working… this can take a minute';
      try {
        const r = await call(fn);
        await reload();
        toast(fn === 'scanChannels' ? 'Scan finished: ' + r.added + ' new video(s)' + (r.errors.length ? '. Problems: ' + esc(r.errors.join('; ')) : '')
          : 'Checked ' + nf(r.refreshed) + ' YouTube video(s), ' + nf(r.changed) + ' updated', 7000);
      } catch (err) { toast(errMsg(err), 7000); el.disabled = false; el.textContent = txt; }
      break;
    }
    case 'reload': toast('Reloading…'); try { await reload(); toast('Up to date'); } catch (err) { toast(errMsg(err), 6000); } break;
    case 'vlink': {
      const id = el.dataset.id, inp = document.querySelector('input[data-id="' + id + '"]');
      linkPairs([{ video_id: id, item_no: inp.value.trim() }]); break;
    }
    case 'linkall': {
      const pairs = [];
      $$('input[data-act="vitem"]').forEach(i => { if (i.value.trim()) pairs.push({ video_id: i.dataset.id, item_no: i.value.trim() }); });
      if (!pairs.length) { toast('No item numbers filled in.'); break; }
      if (await ask('Link ' + pairs.length + ' videos?', 'Each video becomes its item\'s YouTube link. The old link is kept as "previous" and the item goes back to Unreviewed.', 'Link ' + pairs.length)) linkPairs(pairs);
      break;
    }
    case 'vignore': {
      const id = el.dataset.id;
      try { await call('ignoreVideos', [id]); S.videos = S.videos.filter(v => v.video_id !== id); setBadge(); render(); } catch (err) { toast(errMsg(err)); }
      break;
    }
    case 'parsepaste': S.preview = parsePaste($('#paste').value, $('#ptype').value); $('#pv').innerHTML = previewHtml(); break;
    case 'clearpv': S.preview = []; $('#pv').innerHTML = ''; break;
    case 'logrefresh': loadUsers(); break;
    case 'logexport': {
      const rows = [['When', 'Who', 'What', 'Device', 'Browser details']].concat((S.logins || []).map(l => [new Date(l.at).toLocaleString(), l.username, l.event, deviceLabel(l.device), l.device || '']));
      XLSX.writeFile(toWorkbook([{ name: 'Sign-in log', rows: rows }]), 'Sign-in log ' + isoDay(new Date()) + '.xlsx');
      break;
    }
    case 'reviewnew': S.filter = 'new_links'; S.search = ''; S.priceOnly = false; go('review'); break;
    case 'previewfile': {
      const ic = +$('#lic').value, body = FILE_L.rows.slice(FILE_L.hi + 1), rows = [];
      const cols = $$('[data-lcol]').filter(s => s.value).map(s => [+s.dataset.lcol, s.value]);
      body.forEach(r => cols.forEach(([c, t]) => {
        const url = String(r[c] || '').trim();
        if (/^https?:\/\//i.test(url)) rows.push(linkRow(ic >= 0 ? r[ic] : '', url, t));
      }));
      S.preview = rows; $('#pv').innerHTML = previewHtml(); $('#pv').scrollIntoView({ behavior: 'smooth' });
      break;
    }
    case 'applypv': {
      const rows = S.preview.filter(r => rowState(r)[2]);
      el.disabled = true; el.textContent = 'Applying…';
      try {
        const r = await call('importLinks', rows);
        S.preview = []; await reload();
        S.filter = 'new_links'; S.search = ''; S.priceOnly = false; if ($('#q')) $('#q').value = ''; go('items');
        toast('Added ' + r.updated + ' link(s) to the review list' + (r.same ? ', ' + r.same + ' unchanged' : '') + (r.notFound.length ? ', ' + r.notFound.length + ' item(s) not found' : '') +
          (r.unmatched.length ? ', ' + r.unmatched.length + ' YouTube link(s) with no item # in the title' : ''), 8000);
      } catch (err) { toast(errMsg(err), 7000); el.disabled = false; }
      break;
    }
    case 'applymaster': {
      const ic = +$('#mic').value, nc = +$('#mnc').value, cc = +$('#mcc').value;
      const rows = FILE_M.rows.slice(FILE_M.hi + 1).map(r => ({ item_no: String(r[ic] || '').trim(), name: nc >= 0 ? String(r[nc] || '').trim() : '', category: cc >= 0 ? String(r[cc] || '').trim() : '' })).filter(r => r.item_no);
      const off = $('#moff').checked;
      if (off && !(await ask('Update the price sheet?', 'Items that are not in this file will be marked "not on price sheet". They stay in the tracker and are hidden from the dashboard by default.', 'Import ' + nf(rows.length) + ' items'))) break;
      el.disabled = true; el.textContent = 'Importing…';
      try {
        const r = await call('importItems', rows, off);
        await reload();
        toast('Item list imported: ' + r.created + ' new, ' + r.updated + ' updated' + (r.markedOff ? ', ' + r.markedOff + ' marked off the price sheet' : ''), 7000);
      } catch (err) { toast(errMsg(err), 7000); el.disabled = false; el.textContent = 'Import item list'; }
      break;
    }
    case 'savesettings': {
      const obj = {
        review_months: +$('#st_rm').value || 6, youtube_years: +$('#st_yy').value || 3,
        channels: $('#st_ch').value.trim()
      };
      if ($('#st_key')) obj.youtube_api_key = $('#st_key').value.trim();
      try { S.settings = await call('saveSettings', obj); CUT = new Date(new Date().getFullYear() - S.settings.youtube_years, 0, 1); render(); toast('Settings saved'); }
      catch (err) { toast(errMsg(err)); }
      break;
    }
  }
});
document.addEventListener('change', async e => {
  const el = e.target, act = el.dataset.act;
  if (act === 'setfilter') { S.filter = el.value; S.shown = 300; render(); }
  else if (act === 'setcat') { S.cat = el.value; S.shown = 300; render(); }
  else if (act === 'urole' || act === 'ustatus') {
    const u = el.dataset.u, me = u.toLowerCase() === String(S.user).toLowerCase(), v = el.value;
    if (me && ((act === 'urole' && v !== 'Admin') || (act === 'ustatus' && v === 'Disabled'))) {
      const ok = await ask(act === 'urole' ? 'Change your own role?' : 'Disable your own account?', act === 'urole'
        ? 'You will lose access to Settings and this Users page right away.' : 'You will be signed out and will not be able to sign back in.', 'Yes, continue');
      if (!ok) { main.innerHTML = viewUsers(); return; }
    }
    const patch = { username: u }; patch[act === 'urole' ? 'role' : 'status'] = v;
    await saveUser(patch, esc(u) + (act === 'urole' ? ' is now ' + (v === 'Admin' ? 'an Administrator' : 'a' + (v === 'Editor' ? 'n ' : ' ') + v) : ' is now ' + v));
    if (me) { try { setData(await call('getData')); } catch (err) { if (err.auth) { signOut(err.message); return; } } routeFromHash(); }
  }
  else if (act === 'export') { const v = el.value; el.value = ''; if (v) doExport(v); }
  else if (act === 'loguser') { S.logUser = el.value; try { S.logins = await call('listLogins', S.logUser); } catch (err) { toast(errMsg(err)); } const c = $('#logincard'); if (c) c.outerHTML = loginLogHtml(); }
  else if (act === 'set' || act === 'note') save(el.dataset.no, { [el.dataset.f]: el.value }, true);
  else if (act === 'vitem') { S.vsel[el.dataset.id] = el.value.trim(); render(); }
  else if (act === 'pvitem' || act === 'pvtype') {
    const r = S.preview[+el.dataset.i]; if (!r) return;
    if (act === 'pvitem') { const v = el.value.trim(); r.item_no = matchItemNo(v) || v; r.auto = false; } else r.type = el.value;
    const tw = $('#pvcard .tablewrap'), top = tw ? tw.scrollTop : 0;
    $('#pv').innerHTML = previewHtml();
    const tw2 = $('#pvcard .tablewrap'); if (tw2) tw2.scrollTop = top;
  }
  else if (el.id === 'wbfile' && el.files[0]) {
    const file = el.files[0];
    try {
      const wb = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true })); } catch (er) { rej(er); } }; fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(file); });
      S.wb = parseWorkbook(wb, file.name);
      const isNew = S.wb.items.filter(x => !getItem(x.item_no)).length;
      $('#wbsum').innerHTML = '<div class="stack" style="margin-top:12px"><div><b>' + nf(S.wb.items.length) + ' items</b> found (' + nf(isNew) + ' new, ' + nf(S.wb.items.length - isNew) + ' already here)' +
        (S.wb.categories.length ? ', plus <b>' + nf(S.wb.categories.length) + ' categories</b>' : '') + '.</div>' +
        '<div class="small muted">Columns used: ' + esc(S.wb.known.join(', ')) + '</div>' +
        (S.wb.extraCols.length ? '<div class="small muted">Kept as price-list details on each item: ' + esc(S.wb.extraCols.join(', ')) + '</div>' : '') +
        '<label class="small row"><input type="checkbox" id="wboff"> Mark items that are not in this file as "not on price sheet"</label>' +
        '<div><button class="pri" data-act="applywb">Load ' + nf(S.wb.items.length) + ' items</button></div></div>';
    } catch (err) { $('#wbsum').innerHTML = '<p class="err">' + errMsg(err) + '</p>'; }
  }
  else if (el.id === 'mfile' && el.files[0]) { try { mapMaster(await readFileRows(el.files[0])); } catch (err) { toast('Could not read that file: ' + errMsg(err)); } }
  else if (el.id === 'lfile' && el.files[0]) { try { mapLinks(await readFileRows(el.files[0])); } catch (err) { toast('Could not read that file: ' + errMsg(err)); } }
});
let qT;
$('#q').addEventListener('input', e => {
  clearTimeout(qT);
  qT = setTimeout(() => { S.search = e.target.value; S.shown = 300; if (S.view !== 'items') go('items'); else render(); }, 200);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { const n = $('#m_no'); if (n) n.click(); return; }
  if (S.view !== 'item' || (e.target.closest && e.target.closest('input,textarea,select'))) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
let tx = null, ty = null;
main.addEventListener('touchstart', e => {
  if (S.view !== 'item' || (e.target.closest && e.target.closest('input,textarea,select,iframe,video,.noswipe'))) { tx = null; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
main.addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 60) step(dx < 0 ? 1 : -1);
});

updateThemeBtn();
start();
